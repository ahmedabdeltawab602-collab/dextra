[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydextra"
dynamic = ["version"]
description = "Lightweight exploratory-data-analysis, cleaning, feature-engineering, selection and baseline-modeling helpers: one line of code -> a rich table, a multi-panel plot, and a decision sentence, on top of pandas / scikit-learn."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ahmed Abd El Tawab", email = "ahmedabdeltawab3740@gmail.com" },
]
keywords = ["dextra", "pandas", "eda", "statistics", "visualization", "scikit-learn", "machine-learning", "feature-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Smart-loader detection helpers (Phase 11 `load` / `peek`). Imported lazily with
# pure-stdlib fallbacks, so the loader works (with reduced detection quality)
# without them.
io = [
  "charset-normalizer>=3.0",
  "clevercsv>=0.8",
  "openpyxl>=3.1",
]
# Interactive Plotly figures (currently used by plot_boxplots / boxpl). Kept
# out of the core install so headless / server deployments stay lightweight.
viz = [
  "plotly>=5.10",
]
# Optional high-performance / alternative data backends. dextra accepts polars
# DataFrames and pyarrow Tables at its public entry points and converts them to
# pandas via .to_pandas(); install this extra to use them.
perf = [
  "polars>=0.20",
  "pyarrow>=14",
]
# scikit-learn powers the model-based selectors (importance, rfe), the Phase 6
# models (regress, classify, cluster) and the sklearn-compatible wrappers in
# dextra.compat. Imported lazily so the rest of the library works without it.
ml = [
  "scikit-learn>=1.1",
]
# statsmodels powers the Phase 8 time-series tests/decomposition (STL) and
# the ADF / KPSS stationarity tests. Imported lazily so the rest of the
# library works without it.
ts = [
  "statsmodels>=0.14",
]
# Streamlit powers the Phase 10 interactive dashboard (`dx.dash`). Imported
# lazily and only when the generated app runs, so the base install and CI
# are unaffected (the renderer is tested with a stub).
dash = [
  "streamlit>=1.30",
]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "hypothesis>=6.90",
  "pytest-benchmark>=4.0",
  "build>=1.0",
  "twine>=5.1",
  "plotly>=5.10",
  "scikit-learn>=1.1",
  "statsmodels>=0.14",
  "charset-normalizer>=3.0",
  "clevercsv>=0.8",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/ahmedabdeltawab602-collab/dextra"
Documentation = "https://github.com/ahmedabdeltawab602-collab/dextra#readme"
Issues = "https://github.com/ahmedabdeltawab602-collab/dextra/issues"
Source = "https://github.com/ahmedabdeltawab602-collab/dextra"
Changelog = "https://github.com/ahmedabdeltawab602-collab/dextra/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dextra = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "dextra._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "Statistics Course Build",
    "tests/legacy",
    "notebooks",
    "*.bak",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E701", "E702", "B028"]

# Lenient, non-blocking type checking. dextra ships PEP 561 type markers
# (py.typed); mypy is run informationally in CI (continue-on-error) and is
# tightened gradually rather than gating the build.
[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = false
check_untyped_defs = false
follow_imports = "silent"
exclude = "(tests/legacy|Statistics Course Build|notebooks)"
