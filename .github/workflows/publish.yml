name: publish

# PARKED (2026-07-02): publishing is done deliberately from the maintainer's
# machine (twine, explicit version glob) until PyPI Trusted Publishing is
# configured for the 'pydextra' project. Manual trigger only -- a GitHub
# Release will NOT auto-publish.
on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pydextra
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
