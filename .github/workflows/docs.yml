name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs + runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,ml,viz]"
      - name: Build and deploy to GitHub Pages
        run: mkdocs gh-deploy --force
