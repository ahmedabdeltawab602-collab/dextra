name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy (informational, non-blocking)
        continue-on-error: true
        run: mypy src/dextra

      - name: Run tests
        run: pytest --cov=dextra --cov-report=term-missing --cov-fail-under=68

  benchmarks:
    runs-on: ubuntu-latest
    # Performance tracking only; never blocks the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run micro-benchmarks
        run: pytest benchmarks/ --benchmark-only --benchmark-min-rounds=3

  build:
    runs-on: ubuntu-latest
    # Verifies the package builds and its metadata is valid (PyPI-ready).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

  perf-extras:
    runs-on: ubuntu-latest
    # Audit #8: exercise the perf path (pyarrow parquet + polars) so the
    # parquet branches of dash/load and the polars pass-through stay covered.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with perf extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,perf]"

      - name: Run tests (perf extras active)
        run: pytest --cov=dextra --cov-fail-under=68

  pandas-matrix:
    runs-on: ubuntu-latest
    # Audit #8b: early warning across pandas/numpy generations.
    # Informational (non-blocking): upstream pins move faster than releases.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pandas: "pandas==2.1.*"
            numpy: "numpy==1.26.*"
          - python-version: "3.11"
            pandas: "pandas==2.2.*"
            numpy: "numpy==2.0.*"
          - python-version: "3.12"
            pandas: "pandas>=3.0"
            numpy: "numpy>=2.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and pinned pandas/numpy
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
          pip install "${{ matrix.pandas }}" "${{ matrix.numpy }}"

      - name: Show resolved versions
        run: python -c "import pandas, numpy; print(pandas.__version__, numpy.__version__)"

      - name: Run tests
        run: pytest --cov=dextra --cov-fail-under=68
