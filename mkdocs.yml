site_name: dextra
site_description: >-
  One line of code -> a rich table, a multi-panel plot, and a decision
  sentence. EDA, cleaning, feature engineering, selection and baseline
  modeling helpers on top of pandas and scikit-learn.
repo_url: https://github.com/ahmedabdeltawab602-collab/dextra
repo_name: dextra

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference: api.md
